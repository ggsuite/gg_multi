name: gg_multi
description: Das Herzstück der Gg Multi Suite. Fungiert als Backend und CMD-Line Tool.
version: 7.0.1
repository: https://github.com/ggsuite/gg_multi.git

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  path: ^1.9.1
  args: ^2.7.0
  gg_one: ^12.0.0
  gg_lang: ^0.3.1
  gg_console_colors: ^2.1.5
  gg_args: ^2.0.5
  gg_git: ^3.1.1
  gg_log: ^1.0.6
  gg_status_printer: ^1.1.4
  # IsInRegistry was added in 3.9.0. gg_publish must be published with a
  # »minor« increment, otherwise this constraint cannot be satisfied.
  gg_publish: ^3.9.0
  pub_semver: ^2.2.0
  mocktail: ^1.0.5
  http: ^1.6.0
  pubspec_parse: ^1.5.0
  gg_changelog: ^1.1.3
  interact: ^2.2.0
  recase: ^4.1.0
  gg_localize_refs: ^3.0.0
  gg_local_package_dependencies: ^2.0.0
dev_dependencies:
  gg_capture_print: ^1.0.9
  lints: ^6.1.0
  test: ^1.31.2

executables:
  gg_multi:

